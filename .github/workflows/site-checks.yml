name: Site — integridade da versão aprovada

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  site:
    name: Site — páginas, links e integridade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validar páginas e arquivos da composição aprovada
        run: node scripts/check-site.cjs
      - name: Conferir diff
        run: git diff --check
